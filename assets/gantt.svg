<svg viewBox="0 0 1000 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience Gantt chart: health informatics 2024, King's Genomics lab and genomics roles 2025 to 2026, PhD from October 2026">
  <style>
    :root { --bone:#1F1F1F; --muted:#6E6E6E; --dim:#9A9A9A; --rule:#C8C8C8; --accent:#3A3A3A; --ghost:#D6D6D6; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .a1{animation-delay:.15s} .a2{animation-delay:.4s} .a3{animation-delay:.7s} .a4{animation-delay:1s} .a5{animation-delay:1.3s} .a6{animation-delay:1.6s} .a7{animation-delay:1.9s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.pulse,.ring { animation: none; } .draw{stroke-dashoffset:0} .rise,.fade{opacity:1} .ring{opacity:0}
    }
    .grow { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: grow 1s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .grow { animation: none; transform: none; } }
  </style>
