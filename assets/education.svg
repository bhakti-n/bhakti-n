<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Education: PhD Tel Aviv University with residency at the Weizmann Institute, MSc King's College London, BTech COEP">
  <style>
    :root { --bone:#1F1F1F; --muted:#6E6E6E; --dim:#9A9A9A; --rule:#C8C8C8; --accent:#3A3A3A; --ghost:#D6D6D6; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .a1{animation-delay:.15s} .a2{animation-delay:.4s} .a3{animation-delay:.7s} .a4{animation-delay:1s} .a5{animation-delay:1.3s} .a6{animation-delay:1.6s} .a7{animation-delay:1.9s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.pulse,.ring { animation: none; } .draw{stroke-dashoffset:0} .rise,.fade{opacity:1} .ring{opacity:0}
    }
  </style>
  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
    <text class="mono " x="48" y="28" font-size="11" fill="var(--muted)" letter-spacing="3.5">EDUCATION</text>
    <text class="mono " x="952" y="28" font-size="11" fill="var(--muted)" letter-spacing="3.5" text-anchor="end">FIG. 03</text>
  <line x1="140" y1="60" x2="140" y2="390" stroke="var(--rule)" opacity=".5"/>
  <g class="rise a1">
    <text class="mono " x="48" y="84" font-size="12" fill="var(--accent)" letter-spacing="2">NOW</text>
    <text class="mono " x="156" y="84" font-size="15" fill="var(--bone)">Tel Aviv University · 2026 / present</text>
    <text class="mono " x="156" y="108" font-size="14" fill="var(--accent)">PhD, Neurobiology and Neurosciences</text>
    <text class="mono " x="156" y="132" font-size="13.5" fill="var(--muted)">registered at TAU · full time doctoral research residency</text>
    <text class="mono " x="156" y="154" font-size="13.5" fill="var(--muted)">at the Weizmann Institute of Science under a collaborative agreement</text>
  </g>
  <g class="rise a2">
    <text class="mono " x="48" y="206" font-size="12" fill="var(--accent)" letter-spacing="2">2024</text>
    <text class="mono " x="156" y="206" font-size="15" fill="var(--bone)">King's College London</text>
    <text class="mono " x="156" y="230" font-size="14" fill="var(--accent)">MSc, Applied Statistical Modelling and Health Informatics</text>
    <text class="mono " x="156" y="254" font-size="13.5" fill="var(--muted)">thesis: structural variants in cryptic exons in ALS · Dr. Alfredo Iacoangeli</text>
    <text class="mono " x="156" y="276" font-size="13.5" fill="var(--muted)">Snakemake pipeline for SV discovery · splicing and translation impact</text>
  </g>
  <g class="rise a3">
    <text class="mono " x="48" y="328" font-size="12" fill="var(--accent)" letter-spacing="2">2023</text>
    <text class="mono " x="156" y="328" font-size="15" fill="var(--bone)">COEP Technological University</text>
    <text class="mono " x="156" y="352" font-size="14" fill="var(--accent)">BTech, Electrical Engineering</text>
    <text class="mono " x="156" y="376" font-size="13.5" fill="var(--muted)">ML for power system fault detection · TEDxCOEP</text>
  </g>
</svg>
