<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bhakti Nagpurkar, bioinformatician and PhD student at the Weizmann Institute of Science and Tel Aviv University">
  <style>
    :root { --bone:#1F1F1F; --muted:#6E6E6E; --dim:#9A9A9A; --rule:#C8C8C8; --accent:#3A3A3A; --ghost:#D6D6D6; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .a1{animation-delay:.15s} .a2{animation-delay:.4s} .a3{animation-delay:.7s} .a4{animation-delay:1s} .a5{animation-delay:1.3s} .a6{animation-delay:1.6s} .a7{animation-delay:1.9s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade,.pulse,.ring { animation: none; } .draw{stroke-dashoffset:0} .rise,.fade{opacity:1} .ring{opacity:0}
    }
  </style>
  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--rule)"/>
  <g class="fade a1">
    <text class="mono " x="952" y="44" font-size="11" fill="var(--muted)" letter-spacing="3.5" text-anchor="end">REHOVOT · TEL AVIV, IL · 31.9° N</text>
  </g>
  <g class="rise a2">
    <text class="mono " x="46" y="160" font-size="72" fill="var(--bone)" letter-spacing="-2">Bhakti Nagpurkar</text>
  </g>
  <g class="fade a3">
    <text class="mono " x="48" y="198" font-size="18" fill="var(--muted)">Bioinformatician · PhD student</text>
  </g>
  <g class="fade a4">
    <text class="mono " x="48" y="246" font-size="12.5" fill="var(--dim)" letter-spacing="1">interests  ▸</text>
    <text class="mono " x="160" y="246" font-size="12.5" fill="var(--accent)" letter-spacing="1">genomics · neurodegenerative diseases · psychiatric conditions</text>
  </g>
  <g class="fade a5">
    <circle class="pulse" cx="54" cy="285" r="4.5" fill="var(--accent)"/>
    <text class="mono " x="70" y="290" font-size="16" fill="var(--bone)">Weizmann Institute of Science ×</text>
    <text class="mono " x="70" y="314" font-size="16" fill="var(--bone)">Tel Aviv University</text>
  </g>
  <line class="draw a5" x1="48" y1="350" x2="952" y2="350" stroke="var(--rule)"/>
  <g class="fade a6">
    <text class="mono " x="952" y="380" font-size="11.5" fill="var(--muted)" letter-spacing="3" text-anchor="end">PHD · 2026 / NOW</text>
  </g>
</svg>
